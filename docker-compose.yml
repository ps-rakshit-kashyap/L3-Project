services:
  postgres:
    image: postgres:16-alpine
    container_name: talentforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: talentforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentforge"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - talentforge-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentforge_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@postgres:5432/talentforge
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - talentforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentforge_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - talentforge-network

volumes:
  postgres_data:
    driver: local

networks:
  talentforge-network:
    driver: bridge
